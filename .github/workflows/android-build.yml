name: Build DXP POST Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package DXP POST APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Registered Firebase Keystore, Google Services & Environment
        run: |
          # 1. Restore the exact Firebase-registered debug.keystore (SHA-1: BC:D4:66:58:6A:E6:21:E8:30:B6:87:0A:74:2A:3C:00:7F:24:A4:EA)
          # Never generate a random keystore, because Google Sign-In requires the exact registered SHA-1 fingerprint.
          if [ -f .github/signing-key.b64 ]; then
            base64 -d .github/signing-key.b64 > debug.keystore
            echo "Restored debug.keystore from .github/signing-key.b64"
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          fi
          cp debug.keystore my-upload-key.jks
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1|SHA256"

          # 2. Restore app/google-services.json if excluded during GitHub export
          if [ ! -f app/google-services.json ] && [ -f .github/google-services.b64 ]; then
            base64 -d .github/google-services.b64 > app/google-services.json
            echo "Restored app/google-services.json from .github/google-services.b64"
          fi

          # 3. Ensure firebase_applet_config.xml exists with firestore_database_id
          mkdir -p app/src/main/res/values
          if [ ! -f app/src/main/res/values/firebase_applet_config.xml ]; then
            cat << 'XML_EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-2e8219e8-6f74-4ec1-816d-a3590850d8dc</string>
          </resources>
          XML_EOF
          fi

          # 4. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 5. Accept Android SDK licenses on runner
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Generate Clean CI Gradle Files for Public Runner
        run: |
          cat << 'TOML_EOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.8.2"
          kotlin = "2.1.10"
          coreKtx = "1.15.0"
          junit = "4.13.2"
          junitVersion = "1.2.1"
          espressoCore = "3.6.1"
          lifecycleRuntimeKtx = "2.8.7"
          lifecycleViewmodelCompose = "2.8.7"
          lifecycleRuntimeCompose = "2.8.7"
          activityCompose = "1.9.3"
          composeBom = "2024.09.00"
          kotlinxCoroutinesAndroid = "1.9.0"
          kotlinxCoroutinesCore = "1.9.0"
          kotlinxCoroutinesTest = "1.9.0"
          core = "1.6.1"
          runner = "1.6.2"
          robolectric = "4.14.1"
          firebaseBom = "33.10.0"
          secretsGradlePlugin = "2.0.1"
          googleServices = "4.4.2"
          credentials = "1.3.0"
          googleid = "1.1.1"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          junit = { group = "junit", name = "junit", version.ref = "junit" }
          androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
          androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
          androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
          androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
          androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
          androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
          kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
          kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
          kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
          androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
          androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
          robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
          firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
          firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
          firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
          androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
          androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
          googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secretsGradlePlugin" }
          google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
          TOML_EOF

          cat << 'ROOT_EOF' > build.gradle.kts
          plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.android) apply false
            alias(libs.plugins.kotlin.compose) apply false
            alias(libs.plugins.secrets) apply false
            alias(libs.plugins.google.services) apply false
          }
          ROOT_EOF

          cat << 'APP_EOF' > app/build.gradle.kts
          plugins {
            alias(libs.plugins.android.application)
            alias(libs.plugins.kotlin.android)
            alias(libs.plugins.kotlin.compose)
            alias(libs.plugins.secrets)
            alias(libs.plugins.google.services)
          }

          android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
              applicationId = "com.aistudio.dxppost.kxrqzp"
              minSdk = 24
              targetSdk = 35
              versionCode = 2
              versionName = "1.1"
              testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
            }

            signingConfigs {
              create("debugConfig") {
                storeFile = file("${rootDir}/debug.keystore")
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
              }
            }

            buildTypes {
              debug {
                signingConfig = signingConfigs.getByName("debugConfig")
              }
            }

            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_11
              targetCompatibility = JavaVersion.VERSION_11
            }

            kotlinOptions {
              jvmTarget = "11"
            }

            buildFeatures {
              compose = true
              buildConfig = true
            }
          }

          secrets {
            propertiesFileName = ".env"
            defaultPropertiesFileName = ".env.example"
            ignoreList.add("FIREBASE_APPCHECK_DEBUG_TOKEN")
          }

          dependencies {
            implementation(platform(libs.androidx.compose.bom))
            implementation(platform(libs.firebase.bom))
            implementation(libs.androidx.activity.compose)
            implementation(libs.androidx.compose.material.icons.core)
            implementation(libs.androidx.compose.material.icons.extended)
            implementation(libs.androidx.compose.material3)
            implementation(libs.androidx.compose.ui)
            implementation(libs.androidx.compose.ui.graphics)
            implementation(libs.androidx.compose.ui.tooling.preview)
            implementation(libs.androidx.core.ktx)
            implementation(libs.androidx.lifecycle.runtime.compose)
            implementation(libs.androidx.lifecycle.runtime.ktx)
            implementation(libs.androidx.lifecycle.viewmodel.compose)
            implementation(libs.firebase.firestore)
            implementation(libs.firebase.auth)
            implementation(libs.androidx.credentials)
            implementation(libs.androidx.credentials.play.services)
            implementation(libs.googleid)
            implementation(libs.kotlinx.coroutines.android)
            implementation(libs.kotlinx.coroutines.core)
            debugImplementation(libs.androidx.compose.ui.test.manifest)
            debugImplementation(libs.androidx.compose.ui.tooling)
          }
          APP_EOF

          cat << 'PROPS_EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          kotlin.code.style=official
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          PROPS_EOF

          cat << 'SETTINGS_EOF' > settings.gradle.kts
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "DXP POST"
          include(":app")
          SETTINGS_EOF

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK (Signed with Registered Firebase Keystore)
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DXP-POST.apk
          ls -lh dist/DXP-POST.apk

      - name: Upload DXP-POST APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXP-POST-APK
          path: dist/DXP-POST.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "DXP POST v1.1.${{ github.run_number }} (ئەپی پۆست و گەیاندن)"
          body: |
            ### ئەپی فەرمی DXP POST
            - فایلی **`DXP-POST.apk`** لە خوارەوە دابەزێنە و لەسەر مۆبایلەکەت دایبمەزرێنە.
            - تکایە پێش دامەزراندنی ئەم وەشانە، ئەگەر وەشانی پێشووت لەسەر مۆبایلەکەت هەیە بیسڕەوە (Uninstall) بۆ ئەوەی کلیلی چوونەژوورەوەی گووگڵ (SHA-1) بە دروستی کار بکات.
          files: dist/DXP-POST.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
