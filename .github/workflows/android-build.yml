name: Build DXP POST Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package DXP POST APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Keystore & Environment Files
        run: |
          # Restore debug.keystore from debug.keystore.base64 so Google Sign-In & Firebase match SHA-1
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Normalize Gradle & Android SDK Versions for Public GitHub Runners
        run: |
          python3 - << 'EOF'
          import pathlib, re

          # 1. Normalize gradle/libs.versions.toml to public Google Maven stable artifacts
          toml_path = pathlib.Path("gradle/libs.versions.toml")
          if toml_path.exists():
              txt = toml_path.read_text(encoding="utf-8")
              replacements = {
                  'agp = "9.1.1"': 'agp = "8.8.2"',
                  'coreKtx = "1.18.0"': 'coreKtx = "1.15.0"',
                  'junitVersion = "1.3.0"': 'junitVersion = "1.2.1"',
                  'espressoCore = "3.7.0"': 'espressoCore = "3.6.1"',
                  'kotlin = "2.2.10"': 'kotlin = "2.1.10"',
                  'googleDevtoolsKsp = "2.3.5"': 'googleDevtoolsKsp = "2.1.10-1.0.31"',
                  'robolectric = "4.16.1"': 'robolectric = "4.14.1"',
                  'firebaseBom = "34.17.0"': 'firebaseBom = "33.10.0"',
                  'googleServices = "4.5.0"': 'googleServices = "4.4.2"',
              }
              for old, new in replacements.items():
                  txt = txt.replace(old, new)
              toml_path.write_text(txt, encoding="utf-8")

          # 2. Normalize compileSdk / targetSdk in app/build.gradle.kts for public Android SDK 35
          gradle_path = pathlib.Path("app/build.gradle.kts")
          if gradle_path.exists():
              gtxt = gradle_path.read_text(encoding="utf-8")
              gtxt = re.sub(
                  r'compileSdk\s*\{\s*version\s*=\s*release\(36\)\s*\{\s*minorApiLevel\s*=\s*1\s*\}\s*\}',
                  'compileSdk = 35',
                  gtxt
              )
              gtxt = gtxt.replace('targetSdk = 36', 'targetSdk = 35')
              gradle_path.write_text(gtxt, encoding="utf-8")
          EOF

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK (Signed with Registered Firebase Keystore)
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DXP-POST.apk
          ls -lh dist/DXP-POST.apk

      - name: Upload DXP-POST APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXP-POST-APK
          path: dist/DXP-POST.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "DXP POST v1.0.${{ github.run_number }} (ئەپی پۆست و گەیاندن)"
          body: |
            ### ئەپی فەرمی DXP POST
            - فایلی **`DXP-POST.apk`** لە خوارەوە دابەزێنە و لەسەر مۆبایلەکەت دایبمەزرێنە.
            - بەستراوەتەوە بە بنکەی دراوەی ڕاستەوخۆ (Cloud Firestore) و چوونەژوورەوەی گووگڵ.
          files: dist/DXP-POST.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
